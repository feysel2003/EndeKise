plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.endekise'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.endekise"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    // MPAndroidChart for Analytics
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // --- EXPENSE TRACKER PRO DEPENDENCIES ---

    // 1. Room Database (Crucial: Using annotationProcessor for Java)
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // 2. Lifecycle Components (For MVVM Architecture in Java)
    def lifecycle_version = "2.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"

    // 3. Material Design 3 (For frictionless UI, BottomSheets, and Floating Action Buttons)
    implementation "com.google.android.material:material:1.11.0"

    // 4. Gson (For easily converting JSON/Lists if we need complex offline storage later)
    implementation "com.google.code.gson:gson:2.10.1"
}